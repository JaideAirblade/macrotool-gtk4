[package]
name = "macrotool-gtk4"
version = "0.2.0"
description = "Game macro/automation tool for Linux/Wayland (native GTK 4)"
authors = ["Jaide"]
edition = "2021"

[[bin]]
name = "macrotool"
path = "src/main.rs"

[dependencies]
gtk4 = "0.11"
glib = "0.22"
gio = "0.22"
gdk4 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
once_cell = "1"
kdl = "6"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
rfd = "0.15"
base64 = "0.22"
evdev = "0.13"
nix = { version = "0.29", features = ["fs", "ioctl", "poll"] }
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
libloading = "0.8"
x11 = { version = "2", features = ["xlib"] }
gtk4-layer-shell = "0.8"
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
signal-hook = "0.3"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true